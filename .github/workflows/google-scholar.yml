name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    # 08:17 UTC = 16:17 Asia/Shanghai (GitHub may delay scheduled runs).
    - cron: '17 8 * * *'
  push:
    branches: [master]
    paths:
      - scripts/update_scholar.py
      - scripts/scholar-requirements.txt
      - scripts/test_scholar.py
      - .github/workflows/google-scholar.yml

permissions:
  contents: write

concurrency:
  group: google-scholar-data
  cancel-in-progress: false

jobs:
  update:
    # Scholar may reject hosted runners; failures never replace the last snapshot.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/scholar-requirements.txt
      - run: pip install -r scripts/scholar-requirements.txt
      - name: Check parser and failure handling
        run: python -m unittest discover -s scripts -p test_scholar.py
      - name: Fetch public Scholar statistics
        run: python scripts/update_scholar.py
        env:
          GOOGLE_SCHOLAR_ID: c_qeUtUAAAAJ
          SCHOLAR_OUTPUT: ${{ runner.temp }}/scholar-data/gs_data.json
      - name: Publish successful snapshot
        env:
          SNAPSHOT: ${{ runner.temp }}/scholar-data/gs_data.json
        run: |
          git fetch origin refs/heads/google-scholar-stats:refs/remotes/origin/google-scholar-stats || true
          if git show-ref --verify --quiet refs/remotes/origin/google-scholar-stats; then
            git switch -C google-scholar-stats origin/google-scholar-stats
          else
            git switch --orphan google-scholar-stats
          fi
          cp "$SNAPSHOT" gs_data.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Google Scholar citations'
            git push origin HEAD:google-scholar-stats
          fi
      - name: Run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'scholar-data/gs_data.json').read_text())
          print(f"{data['name']}: **{data['citedby']} citations**\n\nUpdated: {data['updated']}\n")
          print('| Year | Citations |\n| --- | ---: |')
          for year, count in sorted(data['cites_per_year'].items()):
              print(f'| {year} | {count} |')
          PY
