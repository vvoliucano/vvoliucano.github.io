<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在新加坡 PCN 路网上选择途经点，自动吸附到最近路线、计算最短路径并导出 GPX。">
  <meta name="theme-color" content="#081421">
  <meta property="og:title" content="新加坡公园连接网络路径规划">
  <meta property="og:description" content="点击地图选择多个途经点，在 PCN 路网上自动规划路径并导出 GPX。">
  <meta property="og:image" content="https://vvoliucano.github.io/favicon.png">
  <title>新加坡公园连接网络路径规划</title>
  <link rel="stylesheet" href="styles.css?v=20260809-9">
</head>
<body class="planner-page">
  <div class="page-grain" aria-hidden="true"></div>

  <header class="masthead">
    <a class="brand" href="../../projects-zh/" aria-label="返回项目页">
      <span class="brand-seal">路</span>
      <span>新加坡公园连接网络路径规划</span>
    </a>
    <div class="masthead-tools">
      <p class="masthead-note">Waypoints · Nearest PCN · GPX Export</p>
      <a class="masthead-link" href="https://liucan.me" target="_blank" rel="noreferrer">关于作者</a>
    </div>
  </header>

  <main class="planner-main">
    <section class="planner-titlebar" aria-labelledby="page-title">
      <h1 id="page-title">新加坡公园连接网络路径规划</h1>
    </section>

    <section class="workspace planner-layout" aria-label="路径规划地图与导出区">
      <div class="map-panel planner-map-panel">
        <div class="planner-map-toolbar">
          <div id="planner-inline-note" class="planner-inline-note">点击地图依次选点，路线会自动保存在本地。</div>
          <div class="button-group planner-utility-actions">
            <button id="undo-waypoint" class="ghost-button" type="button">撤销</button>
            <button id="clear-waypoints" class="ghost-button" type="button">清空</button>
          </div>
        </div>

        <div class="map-stage planner-map-stage">
          <div class="planner-zoom-controls" aria-label="地图缩放控制">
            <button id="zoom-in" class="ghost-button planner-zoom-button" type="button" aria-label="放大地图">+</button>
            <button id="zoom-out" class="ghost-button planner-zoom-button" type="button" aria-label="缩小地图">-</button>
            <button id="zoom-reset" class="ghost-button planner-zoom-button planner-zoom-reset" type="button" aria-label="重置地图缩放">重置</button>
          </div>
          <div id="map-container" class="map-container" role="img" aria-label="新加坡 PCN 途经点规划地图"></div>
          <div id="map-tooltip" class="map-tooltip" aria-hidden="true"></div>
        </div>
      </div>

      <aside class="info-panel planner-export-panel" aria-live="polite">
        <div class="info-card planner-export-card">
          <p class="card-label">导出</p>
          <div class="planner-action-grid">
            <button id="export-gpx" class="ghost-button" type="button">导出 GPX</button>
            <button id="copy-gpx" class="ghost-button" type="button">复制 GPX</button>
            <button id="open-google-maps" class="ghost-button" type="button">一键直达 Google</button>
            <button id="copy-google-maps-link" class="ghost-button" type="button">复制 Google 链接</button>
          </div>
          <p id="planner-summary" class="card-note">还没有路线。点击地图开始选点。</p>
          <p id="planner-export-note" class="card-note">支持滚轮缩放、拖动平移，以及 100 米近接连通。</p>
        </div>

        <div class="info-card planner-route-card">
          <p class="card-label">当前经过线路</p>
          <ul id="planner-route-breakdown" class="area-list planner-route-breakdown">
            <li class="is-empty">还没有路线。生成路线后，这里会显示当前经过哪些 PCN 线路以及各自里程。</li>
          </ul>
          <p class="card-note planner-disclaimer">我们目前只针对 PCN，没有更多别的数据源。</p>
          <p class="card-note planner-disclaimer">没有任何后台服务器收集你的信息。</p>
        </div>
      </aside>
    </section>
  </main>

  <div id="connectivity-modal" class="planner-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="connectivity-modal-title">
    <div class="planner-modal-card">
      <p class="card-label">路线提示</p>
      <strong id="connectivity-modal-title">当前点位未连通</strong>
      <p id="connectivity-modal-message" class="card-note">你新选的点和前一个点之间没有可用的公开 PCN 连通路径。</p>
      <div class="hero-actions">
        <button id="connectivity-modal-close" class="ghost-button" type="button">我知道了</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="planner.js?v=20260809-8"></script>
</body>
</html>
